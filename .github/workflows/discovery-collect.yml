name: Collect GitHub Discovery
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: run = 正常采集；probe-models = 试运行 AI 翻译（列出可用模型、发一批真实项目、打印对比，不提交数据）
        type: choice
        options: [run, probe-models]
        default: run
permissions:
  contents: write
concurrency:
  group: discovery-collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - name: Probe AI translation (trial, writes nothing)
        if: inputs.mode == 'probe-models'
        run: python -m collector probe-models
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - if: inputs.mode != 'probe-models'
        run: python -m collector run
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional: an email raises the free machine-translation quota from 5,000 to 50,000 characters a day.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          # Search streams (overall + per category) and repository topics: 30 searches a minute with a token.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: one of the strategies in collector/lab/strategies.py (default: full).
          CLASSIFIER_STRATEGY: ${{ vars.CLASSIFIER_STRATEGY }}
          # AI translation: Chinese descriptions + category suggestions. Default provider is Google Gemini
          # (free tier, OpenAI-compatible); without the AI_API_KEY secret this step is skipped.
          # Optional variables: AI_BASE_URL (any OpenAI-compatible API), AI_MODEL, AI_MAX_REQUESTS.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MAX_REQUESTS: ${{ vars.AI_MAX_REQUESTS }}
      - if: inputs.mode != 'probe-models'
        run: python -m unittest discover -s collector -p 'test_*.py'
      - name: Commit snapshots
        if: inputs.mode != 'probe-models'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: update GitHub discovery snapshots'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
